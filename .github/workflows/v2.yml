name: v2
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: |
          python scripts/fetch-postgres.py 18.6.0 '${{ matrix.target }}' pg.tar.gz
          mkdir pg
          tar -xzf pg.tar.gz -C pg --strip-components=1
      - run: python scripts/ci-test.py
        env:
          EP_TEST_VERSION: 18.6.0
          EP_TEST_ROOT: '1'
      - name: 32-bit Unix identity regression
        if: matrix.os == 'ubuntu-24.04'
        run: go test -count=1 -timeout=1m -covermode=atomic -coverprofile=ci-output/platform-386.out ./internal/platform
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
      - name: Native PowerShell installer regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: ci-output/*.out
          if-no-files-found: error
          retention-days: 14
  supported-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [15.19.0, 16.15.0, 17.11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: |
          python scripts/fetch-postgres.py '${{ matrix.version }}' x86_64-unknown-linux-gnu pg.tar.gz
          mkdir pg
          tar -xzf pg.tar.gz -C pg --strip-components=1
          python scripts/ci-test.py
        env:
          EP_TEST_VERSION: ${{ matrix.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-postgres-${{ matrix.version }}
          path: ci-output/*.out
          if-no-files-found: error
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Minimum Go, formatting, standard-library-only production
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go mod tidy -diff
          test -z "$(go list -deps -f '{{if not .Standard}}{{if not .Module.Main}}{{.ImportPath}}{{end}}{{end}}' ./...)"
          go vet ./...
          go test -race -timeout 3m ./...
          bash -n install/install.sh
          python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: Bounded archive fuzzing
        run: go test ./internal/archive -run '^$' -fuzz FuzzExtract -fuzztime 30s
  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker build -f scripts/alpine.Dockerfile -t embedded-postgres-musl-test .
          docker run --rm -v "$PWD:/src" -w /src embedded-postgres-musl-test sh -ec '
            python3 scripts/fetch-postgres.py 18.6.0 x86_64-unknown-linux-musl pg.tar.gz
            mkdir pg
            tar -xzf pg.tar.gz -C pg --strip-components=1
            chown -R pgtest /src
            su pgtest -c "PATH=/usr/local/go/bin:/usr/bin:/bin python3 scripts/ci-test.py"
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-alpine
          path: ci-output/*.out
          if-no-files-found: error
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
  coverage:
    needs: [native, supported-postgres, alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: profiles
      - name: Require 90% aggregate production coverage
        shell: bash
        run: python scripts/coverage.py profiles --minimum 90 --output coverage.out | tee coverage-summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt
  release:
    needs: [native, supported-postgres, alpine, checks, codeql, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - id: version
        run: python scripts/release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.publish == 'true'
        run: python scripts/release.py build '${{ steps.version.outputs.tag }}'
      - if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - if: steps.version.outputs.publish == 'true'
        run: python scripts/release.py publish '${{ steps.version.outputs.tag }}'
        env:
          GH_TOKEN: ${{ github.token }}
