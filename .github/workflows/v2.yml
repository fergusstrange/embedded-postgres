name: v2
on:
  push:
    branches: [codex/embedded-postgres-v2]
  pull_request:
permissions:
  contents: read
concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  process:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: |
          python scripts/fetch-postgres.py 18.6.0 '${{ matrix.target }}' pg.tar.gz
          mkdir pg
          tar -xzf pg.tar.gz -C pg --strip-components=1
          go build -o "$RUNNER_TEMP/embedded-postgres.exe" ./cmd/embedded-postgres
          echo "EP_SUPERVISOR=$RUNNER_TEMP/embedded-postgres.exe" >> "$GITHUB_ENV"
          echo "EP_TEST_BIN=$PWD/pg/bin" >> "$GITHUB_ENV"
      - run: go test -v -timeout 2m ./internal/platform ./internal/supervisor
      - if: runner.os == 'Linux'
        name: Root caller with non-root PostgreSQL
        run: |
          go test -c -o "$RUNNER_TEMP/supervisor.test" ./internal/supervisor
          sudo env EP_TEST_BIN="$EP_TEST_BIN" EP_SUPERVISOR="$EP_SUPERVISOR" EP_TEST_UID="$(id -u)" EP_TEST_GID="$(id -g)" "$RUNNER_TEMP/supervisor.test" -test.v -test.timeout=2m
